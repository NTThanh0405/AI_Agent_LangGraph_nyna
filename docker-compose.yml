# docker-compose.yml
# Chạy cả hệ thống bằng một lệnh: docker compose up -d --build
#   agent         : dịch vụ LangGraph (FastAPI), chỉ n8n gọi được, không mở port ra ngoài
#   dashboards-web: nginx phục vụ file dashboard tên ngẫu nhiên (chỉ đọc) và file Chart.js
#   n8n           : nhận tin nhắn Telegram và gọi sang agent
#   cloudflared   : Cloudflare Tunnel, đưa n8n và dashboards-web ra Internet qua HTTPS
# Phiên bản image n8n/cloudflared đặt qua N8N_IMAGE_TAG / CLOUDFLARED_IMAGE_TAG trong .env
# (mặc định latest; nên ghim phiên bản đang chạy ổn, xem bằng: docker compose images).

services:
  agent:
    build: .
    env_file: .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dashboards:/data/dashboards
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g

  dashboards-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - dashboards:/usr/share/nginx/html:ro
      - ./nginx-dash.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/static:ro

  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_healthy
    environment:
      - N8N_HOST=n8n.nynadatacoffee.com
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.nynadatacoffee.com/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - n8n
      - dashboards-web
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  n8n_data:
  dashboards: