# docker-compose.yml
# Chạy cả hệ thống bằng một lệnh: docker compose up -d --build
#   agent          : service LangGraph (bot Telegram long polling + FastAPI). KHÔNG mở port ra ngoài.
#                    Bot chủ động hỏi Telegram nên không cần webhook/URL công khai.
#   dashboards-web : nginx phục vụ file dashboard tên ngẫu nhiên (chỉ đọc) và file Chart.js
#   cloudflared    : Cloudflare Tunnel, đưa dashboards-web ra Internet qua HTTPS
#
# Cấu hình trong .env (xem thêm .env mẫu):
#   TELEGRAM_BOT_TOKEN, DATABASE_URL..., API key LLM
#   DASHBOARD_BASE_URL=https://dashboard.nynadatacoffee.com
#   DASHBOARD_TTL_HOURS=24
#   CLOUDFLARE_TUNNEL_TOKEN=...
#   CLOUDFLARED_IMAGE_TAG=latest   (nên ghim phiên bản đang chạy ổn, xem bằng: docker compose images)
#
# Cloudflare Zero Trust > Networks > Tunnels > Public Hostname:
#   dash.nynadatacoffee.com  ->  HTTP  ->  dashboards-web:80

services:
  agent:
    build: .
    env_file: .env
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dashboards:/data/dashboards          # agent ghi file dashboard vào đây
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g

  dashboards-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - dashboards:/usr/share/nginx/html:ro                     # chỉ đọc
      - ./nginx-dash.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/static:ro                     # chứa chart.umd.min.js
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - dashboards-web
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  dashboards: