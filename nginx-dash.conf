# nginx-dash.conf
# Cấu hình nginx cho container dashboards-web: chỉ phục vụ file dashboard tên ngẫu nhiên
# (48 ký tự hex + .html) và file Chart.js tự host; mọi đường dẫn khác trả 404.
# CSP chặn trang dashboard gửi dữ liệu ra ngoài (connect-src 'none').

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    location ~ ^/[0-9a-f]{48}\.html$ {
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location = /chart.umd.min.js {
        alias /usr/share/nginx/static/chart.umd.min.js;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}