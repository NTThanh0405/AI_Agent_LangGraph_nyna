# config/agents.yaml
# Cấu hình từng agent trong graph: model, số bước tối đa, timeout.
# Agent nào dùng tool nào KHÔNG khai báo ở đây mà ở code (app/agent/tools/__init__.py: TOOLS_BY_AGENT),
# vì tool là quyền hạn bảo mật, không nên đổi bằng một file cấu hình.
# File được nạp khi service khởi động (đổi xong cần: docker compose restart agent).
# Tên model: khớp mã API của Anthropic (claude-sonnet-5-5, claude-haiku-5-5).
#
# NGUYÊN TẮC CHỌN MODEL (giảm chi phí):
#   - Sonnet: việc mà sai là sai số liệu / sai câu trả lời cuối (coder, supervisor).
#   - Haiku : việc có khuôn mẫu, đầu ra ngắn (analyst, designer, nhận xét báo cáo).
# KHÔNG đặt temperature: Claude 5.5 trả lỗi 400 nếu temperature khác mặc định -> để null.

default:
  temperature: null     # giữ null, đừng đặt số
  max_tokens: 2048      # mặc định thấp để khỏi tốn; agent nào cần nhiều thì ghi riêng bên dưới

agents:
  supervisor:           # điều phối + tổng hợp câu trả lời cuối, không có tool dữ liệu
    enabled: true
    model: claude-sonnet-5-5    # thử claude-haiku-5-5 sau khi có bộ câu hỏi đánh giá
    max_steps: 1        # số vòng tool tối đa mỗi lần được gọi
    timeout_seconds: 45
    max_tokens: 3000    # câu trả lời cuối có bảng số liệu

  analyst:              # hiểu câu hỏi -> AnalysisBrief (đầu ra ngắn, có khuôn)
    enabled: true
    model: claude-haiku-5-5     # ĐỔI từ sonnet. Nếu hay hiểu sai câu hỏi thì trả về sonnet
    max_steps: 4
    timeout_seconds: 45
    max_tokens: 1500

  coder:                # viết/chạy SQL: sai là sai số liệu -> giữ Sonnet
    enabled: true
    model: claude-sonnet-5-5
    max_steps: 6
    timeout_seconds: 60
    max_tokens: 3000

  designer:             # biểu đồ, dashboard
    enabled: true
    model: claude-haiku-5-5
    max_steps: 4
    timeout_seconds: 60
    max_tokens: 6000    # JSON của dashboard nhiều biểu đồ cần chỗ

  reviewer:             # tuỳ chọn: soát lại kết quả trước khi trả; tắt để tiết kiệm chi phí
    enabled: false
    model: claude-sonnet-5-5    # reviewer yếu hơn coder thì vô ích -> nếu bật thì dùng Sonnet
    max_steps: 1
    timeout_seconds: 30
    max_tokens: 1500

# Tổng số lần chuyển giữa các agent trong một câu hỏi (chống lặp vô hạn); graph dùng làm recursion_limit.
max_handoffs: 8