# config/users_seed.yaml
# Danh sách người dùng ban đầu. CHỈ được nạp khi bảng agent_state.users còn TRỐNG
# (xem init_users trong app/telegram/auth.py). Bảng đã có người thì file này bị bỏ qua;
# lúc đó hãy thêm/sửa người bằng lệnh trên Telegram (/adduser, /addadmin...).
#
# telegram_id : ID Telegram của người đó (họ gõ /myid với bot để lấy).
# role        : quyền xem dữ liệu: boss | manager | staff (khai báo ở app/agent/permissions.py).
# level       : quyền quản trị bot: owner | admin | staff
#                 owner = chủ chatbot, ĐÚNG 1 người (thêm/xoá người, cấp admin)
#                 admin = tối đa 3 người
#                 staff = không có quyền quản trị (đây là cấp quản trị, KHÔNG phải role staff)
#
# Nhân viên (role staff) không cần ghi vào đây: thêm bằng /adduser <id> staff <tên>,
# rồi boss/manager cấp quyền xem bảng bằng /capquyen.

users:
  # Người xây pipeline: toàn quyền
  - telegram_id: 9266387226       # <-- thay bằng Telegram ID của bạn
    name: "thanh"
    role: boss
    level: owner

  # CEO, giám đốc, quản lý cấp cao: xem toàn bộ dữ liệu, cấp/thu hồi quyền cho nhân viên,
  # nhưng không có quyền quản trị bot (level: staff)
  - telegram_id: 222222222        # <-- thay bằng Telegram ID của CEO
    name: "CEO"
    role: manager
    level: admin

  - telegram_id: 333333333        # <-- thay bằng Telegram ID của giám đốc
    name: "Giám đốc"
    role: manager
    level: admin